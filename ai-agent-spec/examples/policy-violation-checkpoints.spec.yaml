# Schema-valid. Violates rule: require-checkpoints-for-write-effects
# (a write-side-effect tool exists, but humanInLoop is absent entirely).

specVersion: "0.1"

info:
  name: no-checkpoint-agent
  version: 0.1.0
  owner: some-team
  description: Has a write tool but declares no human-in-loop checkpoints
  lifecycle: pilot

capabilities:
  - id: do-a-thing
    description: Writes a record somewhere
    inputs: { type: object }
    outputs: { type: object }

tools:
  - id: update-something
    type: mcp
    description: Writes a record
    schema: { type: object }
    sideEffects: write

dataContracts: []

model:
  provider: internal-model-gateway
  model: enterprise-llm-v2
  promptTemplateRef: prompts/x.md
  planningStrategy: single-shot

guardrails:
  contentPolicies: []
  refusalConditions: []

auth:
  identityRef: svc-no-checkpoint-agent
  credentialsRef: secretsmanager://no-checkpoint-agent/creds
  scopesPerTool: {}

observability:
  logging: { level: info, destination: central-log-pipeline }
  tracing: { enabled: true }
  metrics: []
  evalSuiteRef: evals/x.yaml

errorHandling:
  onToolFailure: abort
  onTimeout: abort
  onLowConfidence: abstain

deployment:
  environments: [dev]
  rolloutStrategy: direct
  changeHistoryRef: registry/no-checkpoint-agent/CHANGELOG.md

# humanInLoop intentionally omitted
