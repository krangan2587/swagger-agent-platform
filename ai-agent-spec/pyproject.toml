[project]
name = "agent-spec"
version = "0.1.0"
description = "AI Agent Specification schema validation and code generation"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.21",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
validate-spec = "agent_spec.cli:main"
inspect-spec = "agent_spec.inspect_cli:main"
check-spec = "agent_spec.check_cli:main"
build-ir = "agent_spec.build_ir_cli:main"
generate-code = "agent_spec.generate_cli:main"
build-agent = "agent_spec.build_agent_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
